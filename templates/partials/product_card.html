<div class="bg-hz-green-900/30 border border-hz-green-800/50 rounded-lg overflow-hidden card-hover transition-all duration-300">
    <div class="aspect-square overflow-hidden">
        {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}"
             class="w-full h-full object-cover hover:scale-105 transition-transform duration-500"
             loading="lazy">
        {% else %}
        <div class="w-full h-full bg-hz-green-900/60 flex flex-col items-center justify-center">
            <svg class="w-16 h-16 text-hz-green-700" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5l-2.25-1.313M21 7.5v2.25m0-2.25l-2.25 1.313M3 7.5l2.25-1.313M3 7.5l2.25 1.313M3 7.5v2.25m9 3l2.25-1.313M12 12.75l-2.25-1.313M12 12.75V15m0 6.75l2.25-1.313M12 21.75V15m0 0l-2.25 1.313M3 16.5v2.25m0-2.25l2.25 1.313M21 16.5l-2.25 1.313M21 16.5v2.25"/>
            </svg>
            <span class="text-hz-green-700 text-xs mt-2 font-mono">ICE</span>
        </div>
        {% endif %}
    </div>
    <div class="p-4">
        <h3 class="font-display text-xl text-white tracking-wide mb-1">{{ product.name }}</h3>
        <p class="text-gray-400 text-sm mb-3">{{ product.weight_kg }} кг</p>
        {% if product.description %}
        <p class="text-gray-500 text-xs mb-3 line-clamp-2">{{ product.description }}</p>
        {% endif %}
        <div class="flex items-center justify-between">
            <span class="text-hz-accent font-bold text-lg">{{ product.price }} ₴</span>
            <button
                hx-post="{% url 'orders:cart-add-htmx' product.id %}"
                hx-target="#cart-widget"
                hx-swap="innerHTML"
                class="bg-hz-green-800 hover:bg-hz-accent hover:text-hz-dark text-white px-4 py-2 rounded text-sm font-bold uppercase tracking-wider transition-all duration-300">
                В кошик
            </button>
        </div>
    </div>

    <!-- Schema.org Product -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "{{ product.name|escapejs }}",
        "description": "{{ product.description|default:product.name|escapejs }}",
        {% if product.image %}"image": "{{ product.image.url|escapejs }}",{% endif %}
        "offers": {
            "@type": "Offer",
            "price": "{{ product.price }}",
            "priceCurrency": "UAH",
            "availability": "{% if product.is_available %}https://schema.org/InStock{% else %}https://schema.org/OutOfStock{% endif %}"
        },
        "weight": {
            "@type": "QuantitativeValue",
            "value": "{{ product.weight_kg }}",
            "unitCode": "KGM"
        }
    }
    </script>
</div>
