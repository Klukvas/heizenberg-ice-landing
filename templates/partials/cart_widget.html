<a href="{% url 'orders:checkout' %}" aria-label="Кошик" class="relative inline-flex items-center text-gray-300 hover:text-hz-accent transition-colors group">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/>
    </svg>
    {% if cart.get_count > 0 %}
    <span class="absolute -top-2 -right-2 bg-hz-accent text-hz-dark text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">
        {{ cart.get_count }}
    </span>
    {% endif %}
</a>
