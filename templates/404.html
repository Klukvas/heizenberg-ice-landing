{% extends 'base.html' %}

{% block title %}404 — Сторінку не знайдено{% endblock %}

{% block content %}
<section class="min-h-[80vh] flex items-center justify-center px-4">
    <div class="text-center">
        <div class="font-display text-[150px] md:text-[200px] text-hz-accent/20 leading-none select-none">404</div>
        <h1 class="font-display text-4xl md:text-5xl text-white tracking-widest -mt-12 mb-4 text-glow">
            НІЧОГО НЕ ЗНАЙДЕНО
        </h1>
        <p class="text-gray-400 text-lg mb-2 font-mono">Ця сторінка випарувалась, як лід на сонці.</p>
        <p class="text-gray-500 text-sm mb-8 font-mono">"I am the one who knocks" — але тут нікого немає.</p>
        <a href="/" class="inline-block bg-hz-accent text-hz-dark font-bold uppercase tracking-widest px-8 py-4 rounded hover:bg-green-400 transition-all duration-300">
            На головну
        </a>
    </div>
</section>
{% endblock %}
