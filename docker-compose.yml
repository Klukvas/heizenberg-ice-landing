services:
  app:
    image: ${DOCKER_IMAGE:-heizenberg/ice:latest}
    container_name: heizenberg_app
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - heizenberg_net

  celery:
    image: ${DOCKER_IMAGE:-heizenberg/ice:latest}
    container_name: heizenberg_celery
    restart: unless-stopped
    env_file: .env
    command: celery -A config worker -l info --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - heizenberg_net

  postgres:
    image: postgres:16-alpine
    container_name: heizenberg_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in .env}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-heizenberg}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - heizenberg_net

  redis:
    image: redis:7-alpine
    container_name: heizenberg_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - heizenberg_net

  nginx:
    image: nginx:1.27-alpine
    container_name: heizenberg_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - app
    networks:
      - heizenberg_net

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  heizenberg_net:
    driver: bridge
